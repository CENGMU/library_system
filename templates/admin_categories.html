{% extends "base.html" %}
{% block title %}分类管理{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h4 class="fw-bold mb-0">分类管理</h4>
  <a class="btn btn-outline-dark" href="{{ url_for('admin.panel') }}">返回面板</a>
</div>

<div class="row g-3">
  <div class="col-md-5">
    <div class="card shadow-sm rounded-4">
      <div class="card-body p-4">
        <div class="fw-bold mb-3">新增分类</div>
        <form method="post" action="{{ url_for('admin.category_add') }}">
          <input class="form-control mb-3" name="name" placeholder="分类名" required>
          <button class="btn btn-dark w-100">新增</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-7">
    <div class="card shadow-sm rounded-4">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light"><tr><th>分类名</th><th class="text-end">操作</th></tr></thead>
          <tbody>
            {% for c in cats %}
            <tr>
              <td>{{ c.name }}</td>
              <td class="text-end">
                <form method="post" action="{{ url_for('admin.category_delete', cat_id=c.id) }}"
                      onsubmit="return confirm('确定删除分类吗？')">
                  <button class="btn btn-sm btn-outline-danger">删除</button>
                </form>
              </td>
            </tr>
            {% endfor %}
            {% if cats|length == 0 %}
              <tr><td colspan="2" class="text-center text-muted py-4">暂无分类</td></tr>
            {% endif %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
